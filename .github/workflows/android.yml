# Gera o APK do GastoAuto, publica no Release "latest" e testa a abertura num emulador.
name: Android APK

on:
  push:
    branches: [main]
    paths-ignore: ['backend/**', 'README.md', 'logs/**']
  workflow_dispatch:

permissions:
  contents: write

env:
  EXPO_PUBLIC_API_URL: https://gastoauto-api.vercel.app
  EXPO_PUBLIC_APP_TOKEN: fdce16bdd14a088614c66738252394c3b3adc40961802a55

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Instalar dependências
        run: npm ci

      - name: Gerar projeto Android
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: Compilar APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64
          cp app/build/outputs/apk/release/app-release.apk ../GastoAuto.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: GastoAuto.apk

      - name: Publicar no Release "latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: GastoAuto (última versão)
          body: "Build ${{ github.sha }} — baixe o GastoAuto.apk abaixo."
          files: GastoAuto.apk
          make_latest: true

  teste-abertura:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apk

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Abrir o app no emulador e coletar log
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash .github/teste-abertura.sh

      - name: Salvar log no branch "logs"
        if: always()
        run: |
          mkdir -p /tmp/out && cp -r logs/* /tmp/out/ 2>/dev/null || true
          git config user.name "gastoauto-ci"
          git config user.email "ci@users.noreply.github.com"
          git fetch origin logs || true
          git checkout --orphan logs-tmp
          git rm -rf --cached . >/dev/null
          rm -rf ./* .github 2>/dev/null || true
          cp -r /tmp/out/* . 2>/dev/null || echo "sem log" > vazio.txt
          git add -A
          git commit -m "logs ${{ github.sha }}"
          git push -f origin logs-tmp:logs
